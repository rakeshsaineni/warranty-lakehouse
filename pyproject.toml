[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse"
version = "0.1.0"
description = "CDC lakehouse: Debezium-style events -> bronze Parquet -> silver (DuckDB or Spark) -> dbt marts, with data contracts, SCD2 and reconciliation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakesh Saineni" }]
dependencies = ["duckdb>=1.1", "pyarrow>=15", "pyyaml>=6"]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.8"]
spark = ["pyspark>=3.5"]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
